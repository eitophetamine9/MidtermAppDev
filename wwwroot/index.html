<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberType // Defense Grid - Survival Typing Game</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Script & Custom Theme -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace', 'Consolas', 'Courier New'],
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'ping-slow': 'ping 2s cubic-bezier(0, 0, 0.2, 1) infinite',
                        'scanline': 'scanline 8s linear infinite',
                    },
                    keyframes: {
                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(1000%)' },
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MidtermAppDev.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body class="bg-gray-950 text-slate-100 font-mono antialiased overflow-x-hidden selection:bg-cyan-500 selection:text-black">
    <div id="app">
        <div class="fixed inset-0 bg-gray-950 flex flex-col items-center justify-center space-y-4">
            <div class="relative w-16 h-16">
                <div class="absolute inset-0 rounded-full border-4 border-cyan-500/20"></div>
                <div class="absolute inset-0 rounded-full border-4 border-cyan-400 border-t-transparent animate-spin"></div>
            </div>
            <div class="text-cyan-400 font-mono text-sm tracking-widest uppercase animate-pulse">Initializing CyberType OS...</div>
            <div class="text-xs text-gray-500 font-mono">Loading WebAssembly C# Game Runtime</div>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden fixed bottom-0 left-0 right-0 bg-red-950/90 border-t border-red-500 text-red-200 px-6 py-3 text-sm z-50 flex items-center justify-between">
        <span>An unhandled error occurred in the WebAssembly runtime.</span>
        <a href="." class="underline font-bold text-white ml-2">Reload System</a>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
